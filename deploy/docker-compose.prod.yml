# Single-host production stack (cloud-agnostic). Put a TLS-terminating load balancer or reverse proxy in front of `web`.
#   cp deploy/.env.prod.example deploy/.env.prod   # fill every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
#   printf %s "$METRICS_TOKEN" > deploy/metrics_token      # same value as METRICS_TOKEN in .env.prod
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod --profile monitoring up -d   # + Prometheus and Grafana
name: inbox
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: inbox_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      POSTGRES_DB: inbox
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox_owner -d inbox"]
      interval: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    networks: [backend]

  # One-shot: applies pending SQL migrations with the owner role, then exits. The API never connects as the owner.
  migrate:
    image: ${API_IMAGE:-inbox-api}
    command: ["node", "dist/db/cli.js", "migrate"]
    env_file: .env.prod
    environment:
      DATABASE_ADMIN_URL: postgres://inbox_owner:${DB_OWNER_PASSWORD}@postgres:5432/inbox
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [backend]

  api:
    image: ${API_IMAGE:-inbox-api}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://inbox_app:${DB_APP_PASSWORD}@postgres:5432/inbox
      DATABASE_ADMIN_URL: postgres://inbox_owner:${DB_OWNER_PASSWORD}@postgres:5432/inbox
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]

  web:
    image: ${WEB_IMAGE:-inbox-web}
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [frontend]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ../ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    networks: [backend, frontend]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks: [frontend]

networks:
  backend: { internal: true }
  frontend: {}
volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
