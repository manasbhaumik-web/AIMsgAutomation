# Serves the web app and proxies /api to the API container. TLS is terminated in front of this (load balancer or ingress).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  # Strict policy: the app has no inline scripts, loads nothing from other origins, and mail HTML is rendered only inside a
  # sandboxed iframe with scripts disabled.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' about: data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Assistant answers stream as Server-Sent Events.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # The metrics endpoint is for the internal scraper only.
  location = /api/v1/metrics { return 404; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
