name: release
# Tag a version (v1.2.3) to publish images to GitHub Container Registry. Deploying them is a separate, deliberate step
# (docs/ops-runbook.md): this workflow never touches a running environment.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: echo "repo=$(echo ghcr.io/${{ github.repository }} | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - name: Build, scan, then push the API image
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/api.Dockerfile, load: true, tags: "${{ steps.meta.outputs.repo }}-api:${{ github.ref_name }}" }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "${{ steps.meta.outputs.repo }}-api:${{ github.ref_name }}", severity: CRITICAL, ignore-unfixed: true, exit-code: '1' }
      - run: docker push "${{ steps.meta.outputs.repo }}-api:${{ github.ref_name }}"
      - name: Build, scan, then push the web image
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/web.Dockerfile, load: true, tags: "${{ steps.meta.outputs.repo }}-web:${{ github.ref_name }}" }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "${{ steps.meta.outputs.repo }}-web:${{ github.ref_name }}", severity: CRITICAL, ignore-unfixed: true, exit-code: '1' }
      - run: docker push "${{ steps.meta.outputs.repo }}-web:${{ github.ref_name }}"
      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with: { image: "${{ steps.meta.outputs.repo }}-api:${{ github.ref_name }}", artifact-name: sbom-api.spdx.json }
