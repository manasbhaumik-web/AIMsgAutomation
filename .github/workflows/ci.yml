name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: inbox_owner
          POSTGRES_PASSWORD: inbox_owner_dev
          POSTGRES_DB: inbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inbox_owner -d inbox" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://inbox_owner:inbox_owner_dev@localhost:5432/inbox
      TEST_DATABASE_URL: postgres://inbox_app:inbox_app_dev@localhost:5432/inbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create runtime role
        run: psql "$TEST_DATABASE_ADMIN_URL" -f docker/postgres-init.sql
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Service-level checks on embedded Postgres + pgvector
        run: npm run verify

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Fails the build on critical advisories in code that ships. Anything lower is reported below and triaged in
      # docs/08-security-review.md (for example advisories in code paths this app does not use).
      - name: Dependency audit (production, gate on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Dependency audit (full report, informational)
        run: npm audit --omit=dev || true
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          extra_args: --only-verified

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/api.Dockerfile, load: true, tags: inbox-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/web.Dockerfile, load: true, tags: inbox-web:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Scan images (fail on fixable critical findings)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: inbox-api:ci, severity: CRITICAL, ignore-unfixed: true, exit-code: '1' }
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: inbox-web:ci, severity: CRITICAL, ignore-unfixed: true, exit-code: '1' }
      - name: The API image starts and answers its health check
        run: |
          docker run -d --name api-smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://inbox_app:x@127.0.0.1:1/inbox -e JWT_SECRET=q7Hk2VnX9pLw4RtB8mZc1YfG6sJd3AeU \
            -e MASTER_KEY=$(head -c 32 /dev/urandom | base64) -e WEB_URL=https://inbox.example.org -e WORKERS_ENABLED=false inbox-api:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/v1/health && exit 0; sleep 1; done
          docker logs api-smoke; exit 1
