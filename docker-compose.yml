services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: inbox_owner
      POSTGRES_PASSWORD: inbox_owner_dev
      POSTGRES_DB: inbox
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox_owner -d inbox"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
